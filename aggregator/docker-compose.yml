services:
  iptv-agg:
    build: .
    image: iptv-agg:1.0
    container_name: iptv-agg
    restart: unless-stopped
    ports:
      - "8899:8080"
    volumes:
      - ./data:/data
      - ./app.py:/app/app.py:ro
      - ./sources.json:/app/sources.json:ro
      - ./secrets:/secrets:ro
    environment:
      TZ: Asia/Shanghai
      SCHEDULE: "03:20,15:20"
      WORKERS: "50"
      TIMEOUT: "6"
      RETRY: "1"
      MAX_PER_NAME: "2"
      MAX_CHANNELS: "0"
      DEAD_AFTER: "2"
      FAST_TIMEOUT: "3"
      DEAD_TIMEOUT: "2"
      HEAD_FIRST: "1"
      FROZEN_CHECK: "1"
      FROZEN_AFTER: "900"
      MIRRORS: "https://gh-proxy.com/,https://gh.nxnow.top/,"
      RUN_ON_START: "1"
      DEEP_CHECK: "0"
      ADMIN_TOKEN: "${ADMIN_TOKEN:-}"
      LOG_MAX_BYTES: "307200"
      GITHUB_REPO: "${GITHUB_REPO:-}"
      GITHUB_BRANCH: "${GITHUB_BRANCH:-}"
      GIT_SSH_KEY: "/secrets/deploy_key"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8080/healthz',timeout=3)"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 40s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
